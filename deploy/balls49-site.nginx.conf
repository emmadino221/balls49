# Website and extension share HTTPS but use separate backend processes.
server {
    listen 80;
    server_name 159.65.25.30;
    location ^~ /.well-known/acme-challenge/ { root /var/www/balls49-acme; }
    location / { return 301 https://159.65.25.30$request_uri; }
}

server {
    listen 443 ssl;
    server_name 159.65.25.30;
    ssl_certificate /etc/letsencrypt/live/159.65.25.30/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159.65.25.30/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/extension/(stats|stream|backtest|config|ack|reset|update-balance)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /extension/ { return 404; }

    location = /internal/prediction-snapshot {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location / {
        # Public-mode route allowlist in bot.js protects private bot routes.
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

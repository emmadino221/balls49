# Install only AFTER deploying extension-access.js and configuring its key.
# The only upstream routes exposed are authenticated /extension/* requests.
server {
    listen 80;
    server_name 159.65.25.30;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/balls49-acme;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name 159.65.25.30;
    ssl_certificate /etc/letsencrypt/live/159.65.25.30/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159.65.25.30/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/extension/(stats|stream|backtest|config|ack|reset|update-balance)$ {
        # Preserve the /extension/ prefix: it triggers authentication in bot.js.
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
